# The public tracker: once a day, read the MCP registry, list the tools of the servers due a look,
# and commit what changed to the `data` branch. stackduke.com/tracker reads data/feed.json from there.
#
# Nothing here calls a tool or runs a server's code. Each vendor token is a repository secret, handed
# only to the scan step, read from the environment and sent only to that vendor's fixed address.
name: Track

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out the scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No credential is left on disk while the scan reads what servers send; the commit step gets the token alone.
      - name: Check out the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: tracker-data
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The private notice needs watched/ as it was before this scan, to tell new findings from known ones.
      # The copy is kept outside tracker-data, so it is never committed.
      - name: Keep the watched definitions from before the scan
        run: |
          mkdir -p "$RUNNER_TEMP/watched-before"
          if [ -d tracker-data/watched ]; then cp -R tracker-data/watched/. "$RUNNER_TEMP/watched-before/"; fi

      - name: Scan
        # No install step: the scanner has no runtime dependencies.
        run: node src/cli.ts track --data=tracker-data --budget-minutes=55
        env:
          STACKDUKE_SCAN_GITHUB_TOKEN: ${{ secrets.STACKDUKE_SCAN_GITHUB_TOKEN }}
          STACKDUKE_SCAN_LINEAR_TOKEN: ${{ secrets.STACKDUKE_SCAN_LINEAR_TOKEN }}
          STACKDUKE_SCAN_STRIPE_TOKEN: ${{ secrets.STACKDUKE_SCAN_STRIPE_TOKEN }}
          STACKDUKE_SCAN_SUPABASE_TOKEN: ${{ secrets.STACKDUKE_SCAN_SUPABASE_TOKEN }}

      # Findings go to Stackduke's maintainer alone, through Stackduke's endpoint. The request is made on every run, empty or not, and
      # the step prints only fixed lines and never fails, so this public log says nothing about what was found.
      # The notice token is handed to this step only.
      - name: Private notice
        run: node src/cli.ts notice --before="$RUNNER_TEMP/watched-before" --data=tracker-data
        env:
          STACKDUKE_NOTICE_URL: ${{ secrets.STACKDUKE_NOTICE_URL }}
          STACKDUKE_NOTICE_TOKEN: ${{ secrets.STACKDUKE_NOTICE_TOKEN }}

      - name: Commit what changed
        working-directory: tracker-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "stackduke-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "Scan $(date -u +%Y-%m-%d)"
          git -c "http.extraheader=Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push -q "https://github.com/$REPOSITORY.git" HEAD:data
