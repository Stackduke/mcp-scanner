# The public tracker: once a day, read the MCP registry, list the tools of the servers due a look,
# and commit what changed to the `data` branch. stackduke.com/tracker reads data/feed.json from there.
#
# Servers that need a sign-in are tracked privately (since 24 October 2026): what they list goes to the
# `tracker-private` branch of the private Stackduke/stackduke-intelligence repository, never to `data`,
# and this public log only counts them. That branch is reached with a key from the same GitHub App,
# made for the two steps that read and write it. Until the app may write there, those steps fail, and
# the private servers are not looked at at all.
#
# Nothing here calls a tool or runs a server's code. Each vendor token is a repository secret, handed
# only to the step that needs it, read from the environment and sent only to that vendor's fixed address.
#
# A browser sign-in is one secret, STACKDUKE_OAUTH_<VENDOR>: the client that registered itself and
# its tokens. The renew step renews each and writes it straight back, with a key from a GitHub App
# that may do nothing but set this repository's secrets. Every token is hidden from this log, which
# is public, before anything could print it. The renewed access tokens reach the later steps in a
# folder outside the checkout, readable by the runner's user only, deleted when the job ends.
#
# Each scan writes manifest.json: a digest of the whole public data folder and the sha256 of every file it
# wrote. The sign job signs it with Sigstore keyless signing, and the publish-signature job commits the
# signature next to it (docs/verify-a-scan.md). Only the sign job may ask GitHub for an identity token, and
# it cannot push; the scan, which reads what servers send, can do neither. Only a run on main pushes to
# data: the signature names main, so data from any other branch could never be signed.
name: Track

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # For an issue when a sign-in needs a person, and to close it once the server is read again.
  issues: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    outputs:
      # The data commit this run pushed, for the sign job. Empty when nothing was pushed.
      data-commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check out the scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No credential is left on disk while the scan reads what servers send; the commit step gets the token alone.
      - name: Check out the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: tracker-data
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # A key that may read and write the private repository's contents, for the checkout and commit of the
      # private data only. Until the app is installed there with that permission, this step fails, the
      # private data is not checked out, and the scan leaves the private servers alone.
      - name: Key for the private data
        id: private-key
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.STACKDUKE_SIGN_IN_APP_CLIENT_ID }}
          private-key: ${{ secrets.STACKDUKE_SIGN_IN_APP_KEY }}
          owner: Stackduke
          repositories: stackduke-intelligence
          permission-contents: write

      - name: Check out the private data
        id: private-data
        if: ${{ steps.private-key.outcome == 'success' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Stackduke/stackduke-intelligence
          ref: tracker-private
          path: private-data
          token: ${{ steps.private-key.outputs.token }}
          persist-credentials: false

      # The private notice needs watched/ as it was before this scan, to tell new findings from known ones.
      # Only servers watched with a login have watched/, and they are all private now. The copy is kept
      # outside both checkouts, so it is never committed.
      - name: Keep the watched definitions from before the scan
        # On the day the servers move, their definitions are still in the public data, so those count as before too.
        run: |
          mkdir -p "$RUNNER_TEMP/watched-before"
          if [ -d tracker-data/watched ]; then cp -R tracker-data/watched/. "$RUNNER_TEMP/watched-before/"; fi
          if [ -d private-data/watched ]; then cp -R private-data/watched/. "$RUNNER_TEMP/watched-before/"; fi

      # The key is made for the renew step alone, limited to this repository's secrets, and revoked when
      # the job ends. Until the app is set up this step fails, and the renew step renews nothing.
      - name: Key for saving renewed sign-ins
        id: sign-in-key
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.STACKDUKE_SIGN_IN_APP_CLIENT_ID }}
          private-key: ${{ secrets.STACKDUKE_SIGN_IN_APP_KEY }}
          permission-secrets: write

      # Talks to the vendors' sign-in servers and to GitHub, never to an MCP server.
      - name: Renew sign-ins
        # No install step: the scanner has no runtime dependencies.
        run: node src/cli.ts renew-sign-ins --dir="$RUNNER_TEMP/sign-ins" --repo="$REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.sign-in-key.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          STACKDUKE_OAUTH_DROPBOX: ${{ secrets.STACKDUKE_OAUTH_DROPBOX }}
          STACKDUKE_OAUTH_ZAPIER: ${{ secrets.STACKDUKE_OAUTH_ZAPIER }}
          STACKDUKE_OAUTH_CONTENTFUL: ${{ secrets.STACKDUKE_OAUTH_CONTENTFUL }}
          STACKDUKE_OAUTH_GRAFANA: ${{ secrets.STACKDUKE_OAUTH_GRAFANA }}
          STACKDUKE_OAUTH_CIRCLECI: ${{ secrets.STACKDUKE_OAUTH_CIRCLECI }}

      # Reads what servers send, so it holds no GitHub key. It keeps only whether each answered.
      - name: Check sign-ins
        run: node src/cli.ts check-sign-ins --dir="$RUNNER_TEMP/sign-ins"

      # The scan first checks the data folder against the previous scan's signed manifest, and signs the answer
      # into its own (docs/verify-a-scan.md). Verifying needs no permission and no key.
      # Runs whenever the scan can, so a failed sign-in step never leaves the scan without cosign.
      - name: Install cosign to check the previous signature
        if: ${{ !cancelled() }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Scan
        id: scan
        if: ${{ !cancelled() }}
        # The private servers are looked at only when their data was checked out.
        run: node src/cli.ts track --data=tracker-data --budget-minutes=55 --sign-ins="$RUNNER_TEMP/sign-ins" ${PRIVATE_DATA:+--private-data="$PRIVATE_DATA"}
        env:
          STACKDUKE_SCAN_GITHUB_TOKEN: ${{ secrets.STACKDUKE_SCAN_GITHUB_TOKEN }}
          STACKDUKE_SCAN_LINEAR_TOKEN: ${{ secrets.STACKDUKE_SCAN_LINEAR_TOKEN }}
          STACKDUKE_SCAN_STRIPE_TOKEN: ${{ secrets.STACKDUKE_SCAN_STRIPE_TOKEN }}
          STACKDUKE_SCAN_SUPABASE_TOKEN: ${{ secrets.STACKDUKE_SCAN_SUPABASE_TOKEN }}
          PRIVATE_DATA: ${{ steps.private-data.outcome == 'success' && 'private-data' || '' }}

      # Findings go to Stackduke's maintainer alone, through Stackduke's endpoint. The request is made on every
      # run, empty or not, and the step prints only fixed lines and never fails, so this public log says nothing
      # about what was found.
      # The notice token is handed to this step only.
      - name: Private notice
        # Runs whenever the scan did, as the commit step does, whatever happened to the sign-in steps. Only a run on
        # main sends it, so a run dispatched from another branch cannot report its own findings.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.scan.outcome == 'success' && steps.private-data.outcome == 'success' }}
        run: node src/cli.ts notice --before="$RUNNER_TEMP/watched-before" --data=private-data
        env:
          STACKDUKE_NOTICE_URL: ${{ secrets.STACKDUKE_NOTICE_URL }}
          STACKDUKE_NOTICE_TOKEN: ${{ secrets.STACKDUKE_NOTICE_TOKEN }}

      # The private data is saved before the public data, and the public commit waits for it: on the day the
      # servers that need a sign-in move out of the public data, their history must reach the private
      # repository before it leaves the public one.
      # The private repository's commit gets a fresh key: the one made before the scan may have run out.
      # Only a run on main saves the private data: a run dispatched from another branch must not push to tracker-private.
      - name: Key for saving the private data
        id: private-save-key
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.scan.outcome == 'success' && steps.private-data.outcome == 'success' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.STACKDUKE_SIGN_IN_APP_CLIENT_ID }}
          private-key: ${{ secrets.STACKDUKE_SIGN_IN_APP_KEY }}
          owner: Stackduke
          repositories: stackduke-intelligence
          permission-contents: write

      - name: Commit the private data
        id: private-commit
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.private-save-key.outcome == 'success' }}
        working-directory: private-data
        env:
          PRIVATE_TOKEN: ${{ steps.private-save-key.outputs.token }}
        # Prints nothing about what changed: this log is public.
        run: |
          git config user.name "stackduke-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "Private scan $(date -u +%Y-%m-%d)"
          git -c "http.extraheader=Authorization: basic $(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)" push -q "https://github.com/Stackduke/stackduke-intelligence.git" HEAD:tracker-private
          echo "Saved."

      - name: Commit what changed
        id: commit
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.scan.outcome == 'success' && (steps.private-data.outcome != 'success' || steps.private-commit.outcome == 'success') }}
        working-directory: tracker-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "stackduke-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "Scan $(date -u +%Y-%m-%d)"
          git -c "http.extraheader=Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push -q "https://github.com/$REPOSITORY.git" HEAD:data
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Runs whatever happened above, so a lost sign-in, or sign-in steps that did not finish, reach a person.
      - name: Tell a person about sign-ins
        if: ${{ !cancelled() }}
        run: node src/cli.ts sign-in-issues --dir="$RUNNER_TEMP/sign-ins" --repo="$REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}

      - name: Forget the sign-ins
        if: always()
        run: rm -rf "$RUNNER_TEMP/sign-ins"

  # Signs the manifest the scan just pushed, with no stored key: GitHub vouches for this workflow's identity
  # with a short-lived OIDC token, Sigstore's Fulcio issues a ten-minute certificate for that identity, and
  # the signature is logged in Sigstore's public transparency log, Rekor. The bundle (signature, certificate
  # and log proof) goes to the next job as an artifact. This job can read the repository but not push.
  sign:
    needs: track
    if: ${{ !cancelled() && needs.track.outputs.data-commit != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Set here, so this job has only these two (it inherits nothing from the workflow).
    permissions:
      # To check out the scanner and the scan's data commit.
      contents: read
      # To ask GitHub for the OIDC token Sigstore checks. No other job has it.
      id-token: write
    steps:
      - name: Check out the scanner to check the scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With the commit before it, to see what the scan's commit changed.
      - name: Check out the scan's data commit to sign
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.track.outputs.data-commit }}
          path: tracker-data
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Signs only a manifest this run wrote, in a commit holding exactly the folder it describes.
      - name: Check the scan's commit before signing it
        run: node src/cli.ts check-before-signing --data=tracker-data --run-id="$RUN_ID"
        env:
          RUN_ID: ${{ github.run_id }}

      # Installs cosign and checks the download against its published signature.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the manifest
        run: |
          mkdir -p "$RUNNER_TEMP/signature"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/signature/manifest.sigstore.json" tracker-data/manifest.json

      - name: Hand the signature to the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-signature
          path: ${{ runner.temp }}/signature/manifest.sigstore.json
          if-no-files-found: error
          retention-days: 7

  # Commits the signature next to the manifest. It can push to the repository, but holds no identity token.
  publish-signature:
    needs: [track, sign]
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To push the signature to the data branch.
      contents: write
    steps:
      - name: Check out the scanner to verify the signature
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the scan's data commit to publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.track.outputs.data-commit }}
          path: tracker-data
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Unpacked outside the checkout, so the artifact can put nothing else there; only the one file is copied in.
      - name: Take the signature from the sign job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest-signature
          path: ${{ runner.temp }}/signature

      - name: Put the signature next to the manifest
        run: |
          test -f "$RUNNER_TEMP/signature/manifest.sigstore.json" && test ! -L "$RUNNER_TEMP/signature/manifest.sigstore.json"
          cp "$RUNNER_TEMP/signature/manifest.sigstore.json" tracker-data/manifest.sigstore.json

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # The check anyone can run (docs/verify-a-scan.md), so a signature that would not verify is never committed.
      # Only this scan's folder and signature: a scan that recorded an unclean start is still signed, so the
      # next scan can start from a signed folder again.
      - name: Verify the signature
        run: node src/cli.ts verify-manifest --data=tracker-data --repo="$REPOSITORY" --this-scan-only
        env:
          REPOSITORY: ${{ github.repository }}

      - name: Commit the signature
        working-directory: tracker-data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "stackduke-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.sigstore.json
          git commit -q -m "Sign scan $(date -u +%Y-%m-%d)"
          git -c "http.extraheader=Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push -q "https://github.com/$REPOSITORY.git" HEAD:data
